{% if pagina.has_other_pages %}
  <nav class="mt-3" aria-label="Páginas"><ul class="pagination pagination-sm">
    {% if pagina.has_previous %}<li class="page-item"><a class="page-link" href="?p={{ pagina.previous_page_number }}{% if filtro_qs %}&{{ filtro_qs }}{% endif %}">Anterior</a></li>{% endif %}
    <li class="page-item disabled"><span class="page-link">Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span></li>
    {% if pagina.has_next %}<li class="page-item"><a class="page-link" href="?p={{ pagina.next_page_number }}{% if filtro_qs %}&{{ filtro_qs }}{% endif %}">Siguiente</a></li>{% endif %}
  </ul></nav>
{% endif %}
